<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login — Daylist</title>

    <link rel="stylesheet" href="auth.css" />
  </head>

  <body>
    <main class="auth">
      <header class="brand">
        <h1>DAYLIST<span>.</span></h1>

        <p>Focus on today.</p>
      </header>

      <section class="auth-card">
        <div class="auth-header">
          <div class="label">WELCOME BACK</div>

          <h2>Log in.</h2>

          <p>Pick up where you left off.</p>
        </div>

        <form>
          <div class="form-group">
            <label for="username"> Username </label>

            <input
              class="input"
              id="username"
              type="text"
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              class="input"
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
          </div>

          <button class="auth-button" type="submit">Log in</button>
        </form>

        <div class="auth-bottom">
          Don't have an account?

          <a href="register.html"> Create one </a>
        </div>
      </section>

      <footer class="auth-footer">DAYLIST · Make today count.</footer>
    </main>
  </body>
</html>
