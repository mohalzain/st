<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register — Daylist</title>

    <link rel="stylesheet" href="auth.css" />
  </head>

  <body>
    <main class="auth">
      <header class="brand">
        <h1>DAYLIST<span>.</span></h1>

        <p>Focus on today.</p>
      </header>

      <section class="auth-card">
        <div class="auth-header">
          <div class="label">GET STARTED</div>

          <h2>Create account.</h2>

          <p>Keep your day simple and focused.</p>
        </div>

        <form>
          <div class="form-group">
            <label for="username"> Username </label>

            <input
              class="input"
              id="username"
              type="text"
              placeholder="Choose a username"
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              class="input"
              id="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
            />
          </div>

          <button class="auth-button" type="button">Create account</button>
        </form>

        <div class="auth-bottom">
          Already have an account?

          <a href="login.html"> Log in </a>
        </div>
      </section>

      <footer class="auth-footer">DAYLIST · Make today count.</footer>
    </main>
    <script src="registerauth.js"></script>
  </body>
</html>
